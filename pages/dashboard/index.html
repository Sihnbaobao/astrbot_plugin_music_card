<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>听歌 · 音乐卡片</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="hero-badge"><span>🎧</span></div>
        <div class="brand-text">
          <strong>听歌</strong>
          <span id="subtitle">正在连接…</span>
        </div>
      </div>
      <div class="top-actions">
        <span class="pill" id="loginPill">检查中</span>
        <button class="btn ghost" id="refreshBtn" type="button">刷新</button>
      </div>
    </header>

    <div class="notice" id="notice" hidden></div>

    <main class="stack">
      <section class="card">
        <div class="card-head">
          <h2>网易云账号</h2>
          <span class="hint" id="loginHint"></span>
        </div>
        <div class="account" id="accountBox" hidden>
          <img class="avatar" id="accountAvatar" alt="" referrerpolicy="no-referrer" />
          <div class="account-text">
            <strong id="accountName">—</strong>
            <span id="accountUid"></span>
          </div>
          <button class="btn ghost" id="logoutBtn" type="button">退出</button>
        </div>
        <div class="login-row">
          <button class="btn" id="loginBtn" type="button">扫码登录</button>
          <span class="hint" id="qrState"></span>
        </div>
        <div class="qr-box" id="qrBox" hidden>
          <img id="qrImage" alt="登录二维码" />
          <a id="qrLink" target="_blank" rel="noopener">图片没出来？点这里打开登录页</a>
        </div>
        <details class="manual">
          <summary>扫码不行？手动填 Cookie</summary>
          <p class="hint">
            浏览器登录 music.163.com → F12 → Application → Cookies → 复制
            <code>MUSIC_U</code> 和 <code>__csrf</code>，拼成
            <code>MUSIC_U=...; __csrf=...</code> 粘进来。
          </p>
          <textarea id="cookieInput" rows="3" placeholder="MUSIC_U=...; __csrf=..."></textarea>
          <button class="btn ghost" id="cookieBtn" type="button">用 Cookie 登录</button>
        </details>
        <details class="manual">
          <summary>账号密码登录</summary>
          <p class="hint">
            手机号或邮箱 + 密码。密码只用于这一次登录、不会保存；网易云风控严格时可能仍然失败。
          </p>
          <div class="pw-row">
            <input id="accountInput" type="text" autocomplete="off" placeholder="手机号或邮箱" />
            <input id="passwordInput" type="password" autocomplete="off" placeholder="密码" />
            <button class="btn ghost" id="passwordBtn" type="button">登录</button>
          </div>
        </details>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>听一首</h2>
          <span class="hint">听完它会写一句听后感，可选发到评论区</span>
        </div>
        <div class="listen-row">
          <input id="queryInput" type="text" placeholder="歌名或歌手，例如 花谱" />
          <label class="check"><input type="checkbox" id="autoComment" /> 顺便评论</label>
          <button class="btn" id="listenBtn" type="button">听一首</button>
        </div>
        <div class="listen-status" id="listenStatus"></div>
        <div class="listen-result" id="listenResult" hidden>
          <strong id="resultSong"></strong>
          <p id="resultReaction"></p>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>最近在听</h2>
          <span class="hint" id="listenedMeta"></span>
        </div>
        <ul class="records" id="listenedList"></ul>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>我的评论</h2>
          <span class="hint" id="commentsMeta"></span>
        </div>
        <ul class="records" id="commentsList"></ul>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
